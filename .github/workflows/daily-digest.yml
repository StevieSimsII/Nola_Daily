name: Daily Digest

on:
  schedule:
    # 10:00 UTC = 5 AM CDT, 11:00 UTC = 5 AM CST.
    # Extra hours are fallbacks: GitHub often delays public-repo crons by hours,
    # and the old exact-hour==05 gate discarded those delayed runs instead of
    # publishing a late edition.
    - cron: "0 10,11,12,14,16,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nola-daily-digest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether to refresh
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          local_now=$(TZ=America/Chicago date "+%Y-%m-%d %H:%M %Z")
          echo "Local America/Chicago time: ${local_now}"

          if [[ "${EVENT_NAME}" != "schedule" ]]; then
            echo "Manual run — refreshing regardless of existing edition."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          digest_day=$(python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json

          path = Path("docs/data/digest.json")
          if not path.exists():
              print("")
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding="utf-8"))
          stamp = str(payload.get("generated_at") or "").strip()
          if not stamp:
              print("")
              raise SystemExit(0)

          try:
              parsed = datetime.fromisoformat(stamp)
          except ValueError:
              print("")
              raise SystemExit(0)

          central = ZoneInfo("America/Chicago")
          if parsed.tzinfo is None:
              parsed = parsed.replace(tzinfo=central)
          print(parsed.astimezone(central).date().isoformat())
          PY
          )

          today=$(TZ=America/Chicago date +%F)
          echo "Existing digest day: ${digest_day:-none}"
          echo "Today: ${today}"

          if [[ -n "${digest_day}" && "${digest_day}" == "${today}" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Today's edition is already published. Skipping."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No edition for today yet. Refreshing."
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Refresh digest data
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m noladaily --output-dir docs --data-path docs/data/digest.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TEAMS_WEBHOOK_MODE: ${{ vars.TEAMS_WEBHOOK_MODE || 'power_automate' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Commit updated site files
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- docs/data; then
            echo "No digest changes to commit."
            exit 0
          fi

          git add docs/data
          git commit -m "chore: refresh daily digest"
          git push
