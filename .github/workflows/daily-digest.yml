name: Daily Digest

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Refresh digest and site
        run: |
          python -m noladaily --output-dir docs --data-path docs/data/digest.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TEAMS_WEBHOOK_MODE: ${{ vars.TEAMS_WEBHOOK_MODE || 'power_automate' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Commit updated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- docs; then
            echo "No site changes to commit."
            exit 0
          fi

          git add docs
          git commit -m "chore: refresh daily digest"
          git push
