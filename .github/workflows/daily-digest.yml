name: Daily Digest

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip unless it is 5 AM in New Orleans
        id: local_time
        shell: bash
        run: |
          local_hour=$(TZ=America/Chicago date +%H)
          echo "Local America/Chicago hour: ${local_hour}"
          if [[ "${local_hour}" != "05" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not the 5 AM New Orleans run. Exiting cleanly."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.local_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.local_time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Refresh digest data
        if: steps.local_time.outputs.should_run == 'true'
        run: |
          python -m noladaily --output-dir docs --data-path docs/data/digest.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TEAMS_WEBHOOK_MODE: ${{ vars.TEAMS_WEBHOOK_MODE || 'power_automate' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Commit updated site files
        if: steps.local_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- docs/data; then
            echo "No digest changes to commit."
            exit 0
          fi

          git add docs/data
          git commit -m "chore: refresh daily digest"
          gi